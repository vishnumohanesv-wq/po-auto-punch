name: ci
on: [push, pull_request]
jobs:
  parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd packages/parsers && npm test
  legacy-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r legacy/tools/requirements.txt && python -m playwright install --with-deps chromium
      - run: cd legacy/tools && npm ci
      - run: bash legacy/tools/run_tests.sh
